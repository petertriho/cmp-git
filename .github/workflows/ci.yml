name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Only the nightly job runs on the schedule
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Check formatting
        run: nix develop -c make format-check
      - name: Lint
        run: nix develop -c make lint
      - name: Typecheck
        run: nix develop -c make typecheck

  test:
    name: Neovim ${{ matrix.neovim }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: stable
            shell: default
          - neovim: 0.12.0
            shell: nvim-0_12_0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Show Neovim version
        run: nix develop ".#${{ matrix.shell }}" -c nvim --version
      - name: Test
        run: nix develop ".#${{ matrix.shell }}" -c make test

  nightly:
    name: Neovim nightly
    runs-on: ubuntu-latest
    # A cache miss builds Neovim from source
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      # The overrides use the latest overlay instead of the locked one, so the job tests the current nightly
      - name: Show Neovim version
        run: >-
          nix develop .#nightly
          --override-input neovim-nightly-overlay github:nix-community/neovim-nightly-overlay
          --no-write-lock-file
          -c nvim --version
      - name: Test
        run: >-
          nix develop .#nightly
          --override-input neovim-nightly-overlay github:nix-community/neovim-nightly-overlay
          --no-write-lock-file
          -c make test
